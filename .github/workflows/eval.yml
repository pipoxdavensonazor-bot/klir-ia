name: Klir IA Evals

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: klir-ia-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden-set:
    name: Golden set (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run golden set (static fixtures)
        env:
          EVAL_GOLDEN_STATIC_ONLY: "1"
        run: npm run eval

  golden-set-live:
    name: Golden set (live prod)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run golden set against production
        env:
          EVAL_BASE_URL: https://klirline.io
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
        run: npm run eval -- --live

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-set-report
          path: evals/results/run-*.json
          retention-days: 14

  trading-charts:
    name: Trading charts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run trading chart evals (static)
        env:
          EVAL_TRADING_STATIC_ONLY: "1"
        run: npm run eval:trading

      - name: Upload trading report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-charts-report
          path: evals/results/trading-charts-*.json
          retention-days: 14
